<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منيو الخان كافيه</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#071a2b;color:#f7f2e7;font-family:Arial,Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(520px,100%);text-align:center;background:linear-gradient(145deg,#0b2439,#061522);border:1px solid #c9a44a;border-radius:28px;padding:42px 24px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.logo{width:125px;height:125px;border-radius:50%;object-fit:cover;border:3px solid #c9a44a;margin-bottom:22px}
h1{margin:0 0 10px;font-size:34px;color:#d5b45a}
p{margin:0 0 30px;color:#eee7d8;font-size:18px}
a{display:block;text-decoration:none;background:#c9a44a;color:#071a2b;font-weight:800;font-size:20px;padding:17px 22px;border-radius:14px}
a:hover{background:#e1c56f}
.small{margin-top:18px;font-size:13px;color:#aaa}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="al_khan_logo.jpg" alt="AL KHAN CAFE">
  <h1>منيو الخان كافيه</h1>
  <p>اكتشف قائمتنا واستمتع بتجربتك ☕</p>
  <a href="https://drive.google.com/file/d/1jE4AfhFXYiaLfLsO16Q1iAfSWb3KfemG/view?usp=drivesdk" target="_blank" rel="noopener">عرض المنيو</a>
  <div class="small">AL KHAN CAFE</div>
</main>
</body>
</html>
